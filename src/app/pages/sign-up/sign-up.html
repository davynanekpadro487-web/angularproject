<section class="hero-section full-screen gray-light-bg">
    <div class="container-fluid">
        <div class="row align-items-center justify-content-center">

            <!-- Côté information / image (gauche sur desktop) -->
            <div class="col-12 col-md-7 col-lg-6 col-xl-8 d-none d-lg-block">
                <div class="bg-cover vh-100 ml-n3 background-img to7-hero-bg"
                    style="background-image: url(img/hero-bg-2.jpg);">
                    <div class="position-absolute login-signup-content">
                        <div class="position-relative text-white col-md-12 col-lg-7">
                            <h2 class="text-white">Créer votre compte TO7 e-SIM</h2>
                            <p class="lead">Rejoignez-nous et gérez simplement vos forfaits internationaux. Achetez,
                                activez et suivez votre consommation de données dans plus de 150 pays.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulaire d'inscription (droite) -->
            <div class="col-12 col-md-6 col-lg-6 col-xl-4">
                <div class="login-signup-wrap px-4 px-lg-5 my-5">
                    <h1 class="text-center mb-1">Inscription</h1>
                    <p class="text-center mb-5">Ouvrez votre accès personnel.</p>

                    <form class="login-signup-form">
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group mb-3">
                                    <label class="pb-1">Prénom</label>
                                    <input type="text" class="form-control" placeholder="Entrez votre prénom">
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-group mb-3">
                                    <label class="pb-1">Nom</label>
                                    <input type="text" class="form-control" placeholder="Entrez votre nom">
                                </div>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label class="pb-1">Adresse e-mail</label>
                            <input type="email" class="form-control" placeholder="nom@votredomaine.com">
                        </div>

                        <div class="form-group mb-3">
                            <label class="pb-1">Mot de passe</label>
                            <input type="password" class="form-control" placeholder="Créer votre mot de passe">
                        </div>

                        <div class="form-group mb-3">
                            <label class="pb-1">Confirmation du mot de passe</label>
                            <input type="password" class="form-control" placeholder="Confirmer le mot de passe">
                        </div>

                        <button class="btn btn-lg d-block w-100 solid-btn border-radius mt-4 mb-3">
                            Créer mon compte
                        </button>

                        <p class="text-center">
                            <small class="text-muted text-center">
                                J'ai déjà un compte. <a routerLink="/login">Se connecter</a>.
                            </small>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
