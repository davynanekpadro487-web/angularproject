<section class="hero-section full-screen gray-light-bg">
    <div class="container-fluid">
        <div class="row align-items-center justify-content-center">

            <div class="col-12 col-md-7 col-lg-6 col-xl-8 d-none d-lg-block">
                <!-- Image -->
                <div class="bg-cover vh-100 ml-n3 background-img" style="background-image: url(img/hero-bg-1.jpg);">
                    <div class="position-absolute login-signup-content">
                        <div class="position-relative text-white col-md-12 col-lg-7">
                            <h2 class="text-white">Heureux de vous revoir !</h2>
                            <p class="lead">Gérez votre connectivité mondiale depuis votre espace personnel TO7 e-SIM.
                                Consultez vos forfaits, ajoutez des données et voyagez l'esprit tranquille.</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-6 col-xl-4">
                <div class="login-signup-wrap px-4 px-lg-5 my-5">
                    <h1 class="text-center mb-1">
                        Connexion
                    </h1>
                    <p class="text-center mb-5">
                        Accédez à votre tableau de bord.
                    </p>

                    <!--login form-->
                    <form class="login-signup-form">
                        <div class="form-group mb-3">
                            <label class="pb-1">Adresse e-mail</label>
                            <div class="input-group input-group-merge">
                                <div class="input-icon">
                                    <span class="ti-email color-primary"></span>
                                </div>
                                <input type="email" class="form-control" placeholder="nom@votredomaine.com">
                            </div>
                        </div>
                        <!-- Password -->
                        <div class="form-group">
                            <div class="row">
                                <div class="col">
                                    <label class="pb-1">Mot de passe</label>
                                </div>
                                <div class="col-auto">
                                    <a routerLink="/password-reset" class="form-text small text-muted">
                                        Mot de passe oublié ?
                                    </a>
                                </div>
                            </div>
                            <div class="input-group input-group-merge">
                                <div class="input-icon">
                                    <span class="ti-lock color-primary"></span>
                                </div>
                                <input type="password" class="form-control" placeholder="Entrez votre mot de passe">
                            </div>
                        </div>

                        <!-- Submit -->
                        <button class="btn btn-lg d-block w-100 solid-btn border-radius mt-4 mb-3">
                            Se connecter
                        </button>

                        <!-- Link -->
                        <p class="text-center">
                            <small class="text-muted text-center">
                                Vous n'avez pas encore de compte ? <a routerLink="/register">Inscrivez-vous</a>.
                            </small>
                        </p>

                    </form>
                </div>
            </div>
        </div> <!-- / .row -->
    </div>
</section>
