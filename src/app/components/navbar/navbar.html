<header class="header">
    <!--start navbar-->
    <nav class="navbar navbar-expand-lg fixed-top bg-transparent">
        <div class="container">
            <a class="navbar-brand text-decoration-none d-flex align-items-center" routerLink="/">
                <h4 class="text-white mb-0 fw-bold" style="letter-spacing: 1px;">TO7 <span
                        class="text-white">e-SIM</span></h4>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="ti-menu"></span>
            </button>

            <div class="collapse navbar-collapse main-menu" id="navbarSupportedContent">
                <!-- Liens au centre -->
                <ul class="navbar-nav mx-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/" routerLinkActive="active"
                            [routerLinkActiveOptions]="{exact: true}">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/offres" routerLinkActive="active">Nos offres</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/destinations" routerLinkActive="active">Destinations</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/comment-ca-marche" routerLinkActive="active">Comment ça
                            marche</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/a-propos" routerLinkActive="active">À propos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/faq" routerLinkActive="active">FAQ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/contact" routerLinkActive="active">Contact</a>
                    </li>
                </ul>

                <!-- Boutons de connexion à droite -->
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/login" routerLinkActive="active">Connexion</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn outline-btn text-white px-4 ms-lg-3" routerLink="/register"
                            style="padding-top:10px !important; padding-bottom:10px !important;">Créer un compte</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!--end navbar-->
</header>
